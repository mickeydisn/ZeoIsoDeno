<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centering Sprite Extractor with Custom Cuts (V5)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.85em;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 250px 1fr .5fr;
        }
        
        .controls-panel {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 12px;
            height: fit-content;
        }
        
        .upload-section {
            background: white;
            border: 3px dashed #f093fb;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            background: #fff5f7;
            border-color: #f5576c;
        }
        
        .upload-section input {
            display: none;
        }
        
        .control-group {
            margin-bottom: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #dee2e6;
        }
        
        .control-group:last-child {
            border-bottom: none;
        }
        
        .control-label {
            display: block;
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
            font-size: 0.8em;
        }
        
        .control-input {
            width: 100%;
            padding: 6px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 0.85em;
        }
        
        .control-input:focus {
            outline: none;
            border-color: #f093fb;
        }
        
        .value-input {
            flex: 1;
            padding: 6px;
            border: 2px solid #dee2e6;
            border-radius: 6px;
            font-size: 0.85em;
            text-align: center;
        }
        
        .value-input:focus {
            outline: none;
            border-color: #f093fb;
        }
        
        .btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
            margin-bottom: 6px;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        
        .canvas-container {
            background: #2d3436;
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 500px;
            position: relative;
            overflow: auto;
        }
        
        #sourceCanvas {
            border: 2px solid #f093fb;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(240, 147, 251, 0.3);
            image-rendering: pixelated;
            cursor: grab;
            max-width: 100%;
            height: auto;
        }
        
        #sourceCanvas.dragging {
            cursor: ns-resize;
        }
        
        .stats {
            background: #e7f3ff;
            padding: 8px;
            border-radius: 6px;
            font-size: 0.75em;
            margin-bottom: 12px;
        }
        
        .stats-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 3px;
        }
        
        .stats-label {
            color: #495057;
        }
        
        .stats-value {
            font-weight: 600;
            color: #f5576c;
        }
        
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            margin-top: 15px;
            background: white;
            padding: 10px;
            border-radius: 8px;
        }
        
        .preview-item {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .preview-item canvas {
            width: 100%;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✂️ Centering Sprite Extractor with Custom Cuts (V5)</h1>
            <p>Horizontal Center, **Vertical Bottom Alignment**, and **Per-Column Offsets** applied.</p>
        </div>
        
        <div class="main-content">
            <div class="controls-panel">
                <div class="upload-section" id="uploadZone">
                    <div style="font-size: 2em; margin-bottom: 8px;">📁</div>
                    <h3 style="font-size: 1em; margin-bottom: 5px;">Upload Source Sprite Sheet</h3>
                    <p style="font-size: 0.85em; color: #6c757d;">PNG files only</p>
                    <input type="file" id="fileInput" accept="image/png,image/jpg">
                </div>
                
                <div id="stats" class="stats" style="display:none;">
                    <div class="stats-item">
                        <span class="stats-label">Source Size:</span>
                        <span class="stats-value" id="originalSize">-</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Output Size:</span>
                        <span class="stats-value" id="outputSize">-</span>
                    </div>
                    <div class="stats-item">
                        <span class="stats-label">Source Grid:</span>
                        <span class="stats-value" id="sourceGrid">-</span>
                    </div>
                </div>
                
                <div class="control-group">
                    <label class="control-label">🔢 Number of Source Rows</label>
                    <input type="number" class="control-input value-input" id="sourceRowCountInput" value="1" min="1">
                </div>
                
                <div class="control-group">
                    <label class="control-label">🔍 Zoom (Source View)</label>
                    <input type="number" class="control-input value-input" id="zoomInput" 
                           min="0.5" max="4" step="0.1" value="1">
                </div>
                
                <div class="control-group">
                    <label class="control-label">📐 Global Scale</label>
                    <input type="number" class="control-input value-input" id="scaleInput" 
                           min="0.1" max="5" step="0.01" value="1">
                </div>
                
                <div class="control-group">
                    <label class="control-label">↔️ Global Offset X</label>
                    <input type="number" class="control-input value-input" id="offsetXInput" 
                           min="-500" max="500" step="1" value="0">
                </div>
                
                <div class="control-group">
                    <label class="control-label">↕️ Global Offset Y</label>
                    <input type="number" class="control-input value-input" id="offsetYInput" 
                           min="-500" max="500" step="1" value="0">
                </div>

                <div class="control-group">
                    <label class="control-label" style="text-align: center;">↔️ Per Column Offset X</label>
                    <div style="display:block; gap: 5px;">
                        <input type="number" class="column-offset-x value-input" data-col="0" value="0" min="-100" max="100" step="1" title="Col 1">
                        <input type="number" class="column-offset-x value-input" data-col="1" value="0" min="-100" max="100" step="1" title="Col 2">
                        <br>
                        <input type="number" class="column-offset-x value-input" data-col="2" value="0" min="-100" max="100" step="1" title="Col 3">
                        <input type="number" class="column-offset-x value-input" data-col="3" value="0" min="-100" max="100" step="1" title="Col 4">
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label" style="text-align: center;">↕️ Per Column Offset Y</label>
                    <div style="display:block; gap: 5px;">
                        <input type="number" class="column-offset-y value-input" data-col="0" value="0" min="-100" max="100" step="1" title="Col 1">
                        <input type="number" class="column-offset-y value-input" data-col="1" value="0" min="-100" max="100" step="1" title="Col 2">
                        <br>
                        <input type="number" class="column-offset-y value-input" data-col="2" value="0" min="-100" max="100" step="1" title="Col 3">
                        <input type="number" class="column-offset-y value-input" data-col="3" value="0" min="-100" max="100" step="1" title="Col 4">
                    </div>
                </div>
                <div class="control-group">
                    <label class="control-label">
                        <input type="checkbox" id="removeBgCheck" style="margin-right: 5px;">
                        Remove Background
                    </label>
                </div>
                
                <div class="control-group" id="smoothEdgeGroup" style="display:none;">
                    <label class="control-label">🔪 Edge Erosion (in px)</label>
                    <input type="number" class="control-input value-input" id="smoothEdgeInput" 
                           min="0" max="10" step="1" value="2">
                </div>
                
                <div class="control-group">
                    <label class="control-label">
                        <input type="checkbox" id="showTilesCheck" style="margin-right: 5px;">
                        Show Isometric Tiles (Overlay)
                    </label>
                </div>
                
                <button class="btn btn-success" id="exportBtn" style="display:none;">💾 Export Fixed Sheet</button>
            </div>
            
            <div>
                <div class="canvas-container">
                    <canvas id="sourceCanvas"></canvas>
                </div>
            </div>
            <div id="previewSection" style="display:none;">
                <h3 style="margin: 15px 0 10px 0; color: #495057;">Output Preview (192x224 Cells - Auto-Updating):</h3>
                <div class="preview-grid" id="previewGrid"></div>
            </div>

        </div>
    </div>
    
    <script>
        // FINAL ASSET GRID DIMENSIONS (Output)
        const FINAL_SPRITE_WIDTH = 192;
        const FINAL_SPRITE_HEIGHT = 224;
        
        // ISOMETRIC TILE OVERLAY DIMENSIONS
        const TILE_WIDTH = 128;
        const TILE_HEIGHT = 64;
        const TILE_PADDING = 6;
        
        // SOURCE GRID COLUMNS (Fixed at 4)
        const SOURCE_COLS = 4;

        let originalImage = null;
        let sourceCanvas = document.getElementById('sourceCanvas');
        let sourceCtx = sourceCanvas.getContext('2d');
        let sourceRowYPositions = []; // Array of Y-coordinates in original image pixels
        let activeDragLine = -1; // Index of the line being dragged
        let sourceCanvasScale = 1; // Scale factor for the source image on the canvas
        
        // --- DOM Elements ---
        const fileInput = document.getElementById('fileInput');
        const uploadZone = document.getElementById('uploadZone');
        const zoomInput = document.getElementById('zoomInput');
        const scaleInput = document.getElementById('scaleInput');
        const offsetXInput = document.getElementById('offsetXInput');
        const offsetYInput = document.getElementById('offsetYInput');
        const sourceRowCountInput = document.getElementById('sourceRowCountInput');
        const removeBgCheck = document.getElementById('removeBgCheck');
        const smoothEdgeInput = document.getElementById('smoothEdgeInput');
        const smoothEdgeGroup = document.getElementById('smoothEdgeGroup');
        const showTilesCheck = document.getElementById('showTilesCheck');
        const exportBtn = document.getElementById('exportBtn');
        const stats = document.getElementById('stats');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        
        // --- Event Listeners ---
        uploadZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) loadImage(file);
        });
        
        // Drag/Drop for upload (unchanged)
        uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.style.background = '#fff5f7'; });
        uploadZone.addEventListener('dragleave', () => { uploadZone.style.background = 'white'; });
        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault(); uploadZone.style.background = 'white';
            const file = e.dataTransfer.files[0];
            if (file) { loadImage(file); }
        });
        
        // --- Output Control Listeners (Continuous Update) ---
        // Removed previewBtn listener. generatePreview is now called on every output-relevant input change.
        zoomInput.addEventListener('input', updateSourceCanvasZoom); // Only affects source view
        scaleInput.addEventListener('input', updateOutput);
        offsetXInput.addEventListener('input', updateOutput);
        offsetYInput.addEventListener('input', updateOutput);
        sourceRowCountInput.addEventListener('change', () => initSourceGridLines(parseInt(sourceRowCountInput.value)));
        
        removeBgCheck.addEventListener('change', () => {
            smoothEdgeGroup.style.display = removeBgCheck.checked ? 'block' : 'none';
            updateOutput();
        });
        smoothEdgeInput.addEventListener('input', updateOutput);
        showTilesCheck.addEventListener('change', updateOutput);
        
        document.querySelectorAll('.column-offset-x').forEach(input => {
            input.addEventListener('input', updateOutput);
        });
        document.querySelectorAll('.column-offset-y').forEach(input => {
            input.addEventListener('input', updateOutput);
        });
        
        exportBtn.addEventListener('click', exportFixedSheet);

        // --- Dragging Line Event Listeners ---
        sourceCanvas.addEventListener('mousedown', handleMouseDown);
        sourceCanvas.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
        
        // --- Core Functions ---

        function updateOutput() {
            if (!originalImage) return;
            // 1. Update metadata
            updateMetadata();
            // 2. Refresh the preview grid
            generatePreview();
        }

        function updateMetadata() {
            if (!originalImage || sourceRowYPositions.length < 2) return;
            
            const sourceRows = sourceRowYPositions.length - 1; 
            const outputW = FINAL_SPRITE_WIDTH * SOURCE_COLS;
            const outputH = FINAL_SPRITE_HEIGHT * sourceRows;
            
            document.getElementById('outputSize').textContent = `${outputW}x${outputH}`;
            document.getElementById('sourceGrid').textContent = `${SOURCE_COLS}x${sourceRows} (Custom Row Heights)`;
        }
        
        function loadImage(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    document.getElementById('originalSize').textContent = `${img.width}x${img.height}`;
                    stats.style.display = 'block';
                    exportBtn.style.display = 'block';
                    previewSection.style.display = 'block';
                    
                    // Try to auto-guess source rows if dimensions allow
                    const sourceW = img.width / SOURCE_COLS;
                    const calculatedRows = Math.round(img.height / sourceW);
                    if (calculatedRows > 0) {
                        sourceRowCountInput.value = calculatedRows;
                    }

                    initSourceGridLines(parseInt(sourceRowCountInput.value));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }
        
        function updateSourceCanvasZoom() {
            sourceCanvasScale = parseFloat(zoomInput.value);
            sourceCanvas.style.transform = `scale(${sourceCanvasScale})`;
            sourceCanvas.style.transformOrigin = 'top left';
            drawSourceCanvas();
        }
        
        function getBackgroundColor(img) {
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = img.width;
            tempCanvas.height = img.height;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(img, 0, 0);
            const imgData = tempCtx.getImageData(0, 0, 1, 1); 
            return {
                r: imgData.data[0],
                g: imgData.data[1],
                b: imgData.data[2]
            };
        }
        
        function removeBackground(sourceCanvas, bgColor, erosion) {
            const w = sourceCanvas.width;
            const h = sourceCanvas.height;
            const tempCtx = sourceCanvas.getContext('2d');
            const imgData = tempCtx.getImageData(0, 0, w, h);
            const data = imgData.data;
            const tolerance = 40; 
            
            // 1. Initial Alpha Pass
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                const diff = Math.abs(r - bgColor.r) + Math.abs(g - bgColor.g) + Math.abs(b - bgColor.b);
                
                if (diff < tolerance) {
                    data[i + 3] = 0; 
                } else {
                    data[i + 3] = 255; 
                }
            }
            
            // 2. Erosion Pass
            if (erosion > 0) {
                const originalData = new Uint8ClampedArray(data);
                const newAlpha = new Uint8Array(w * h);

                for (let y = 0; y < h; y++) {
                    for (let x = 0; x < w; x++) {
                        const idx = (y * w + x) * 4;
                        if (originalData[idx + 3] === 0) {
                            newAlpha[y * w + x] = 0;
                            continue;
                        }
                        
                        let nearTransparent = false;
                        for (let dy = -erosion; dy <= erosion && !nearTransparent; dy++) {
                            for (let dx = -erosion; dx <= erosion; dx++) {
                                const checkY = y + dy;
                                const checkX = x + dx;
                                
                                if (checkY >= 0 && checkY < h && checkX >= 0 && checkX < w) {
                                    const checkIdx = (checkY * w + checkX) * 4;
                                    
                                    if (originalData[checkIdx + 3] === 0) {
                                        const dist = Math.sqrt(dx * dx + dy * dy);
                                        if (dist <= erosion) {
                                            nearTransparent = true;
                                            break;
                                        }
                                    }
                                }
                            }
                        }
                        
                        newAlpha[y * w + x] = nearTransparent ? 0 : 255;
                    }
                }
                
                // Apply the new alpha values
                for (let i = 0; i < data.length; i += 4) {
                    const idx = i / 4;
                    data[i + 3] = newAlpha[idx];
                }
            }
            
            tempCtx.putImageData(imgData, 0, 0);
        }
        
        function drawIsometricTile(ctx, x, y, w, h) {
            const centerX = x + w / 2;
            const bottomY = y + h - TILE_PADDING;
            ctx.fillStyle = 'rgba(100, 200, 255, 0.3)';
            ctx.strokeStyle = 'rgba(100, 200, 255, 0.8)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(centerX, bottomY - TILE_HEIGHT);
            ctx.lineTo(centerX + TILE_WIDTH / 2, bottomY - TILE_HEIGHT / 2);
            ctx.lineTo(centerX, bottomY);
            ctx.lineTo(centerX - TILE_WIDTH / 2, bottomY - TILE_HEIGHT / 2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }

        // --- Source Editor / Dragging Logic ---

        function initSourceGridLines(rows) {
            if (!originalImage || rows <= 0) return;
            
            rows = Math.min(rows, 100); 
            
            sourceRowYPositions = [];
            const step = originalImage.height / rows;
            
            sourceRowYPositions.push(0); 
            for (let i = 1; i < rows; i++) {
                sourceRowYPositions.push(Math.round(i * step));
            }
            sourceRowYPositions.push(originalImage.height);
            
            drawSourceCanvas();
            updateOutput(); 
        }

        function drawSourceCanvas() {
            if (!originalImage) return;

            sourceCanvas.width = originalImage.width;
            sourceCanvas.height = originalImage.height;

            // updateSourceCanvasZoom() is responsible for applying the scale transformation
            
            sourceCtx.imageSmoothingEnabled = false;
            sourceCtx.clearRect(0, 0, sourceCanvas.width, sourceCanvas.height);
            sourceCtx.drawImage(originalImage, 0, 0, sourceCanvas.width, sourceCanvas.height);

            // 1. Draw separation lines
            for (let i = 1; i < sourceRowYPositions.length - 1; i++) {
                const y = sourceRowYPositions[i];
                sourceCtx.strokeStyle = activeDragLine === i ? 'rgba(255, 255, 0, 1)' : 'rgba(255, 0, 0, 0.8)';
                sourceCtx.lineWidth = 4;
                
                sourceCtx.beginPath();
                sourceCtx.moveTo(0, y);
                sourceCtx.lineTo(originalImage.width, y);
                sourceCtx.stroke();

                sourceCtx.fillStyle = activeDragLine === i ? 'yellow' : 'red';
                sourceCtx.font = '24px Arial';
                sourceCtx.textAlign = 'center';
                sourceCtx.fillText(`[Row ${i}]`, originalImage.width / 2, y - 5);
            }
            
            // 2. Draw column lines
            sourceCtx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
            sourceCtx.lineWidth = 2;
            const sourceW = originalImage.width / SOURCE_COLS;
            for (let i = 1; i < SOURCE_COLS; i++) {
                const x = i * sourceW;
                sourceCtx.beginPath();
                sourceCtx.moveTo(x, 0);
                sourceCtx.lineTo(x, originalImage.height);
                sourceCtx.stroke();
            }
        }

        function getMousePos(canvas, evt) {
            const rect = canvas.getBoundingClientRect();
            console.log(evt.clientX, evt.clientY, rect.left, rect.top)
            console.log(evt.clientX - rect.left, evt.clientY - rect.top)
            return {
                x: (evt.clientX - rect.left) / sourceCanvasScale,
                y: (evt.clientY - rect.top) / sourceCanvasScale
            };
        }

        function handleMouseDown(e) {
            if (!originalImage) return;
            const pos = getMousePos(sourceCanvas, e);
            const y = pos.y;
            
            for (let i = 1; i < sourceRowYPositions.length - 1; i++) {
                const lineY = sourceRowYPositions[i];
                if (Math.abs(y - lineY) < 10) { 
                    activeDragLine = i;
                    sourceCanvas.classList.add('dragging');
                    drawSourceCanvas();
                    break;
                }
            }
        }

        function handleMouseMove(e) {
            if (activeDragLine === -1) return;
            
            const pos = getMousePos(sourceCanvas, e);
            const newY_original = Math.round(pos.y);
            
            const minConstraint = sourceRowYPositions[activeDragLine - 1] + 1;
            const maxConstraint = sourceRowYPositions[activeDragLine + 1] - 1;
            
            let finalY = Math.max(minConstraint, Math.min(maxConstraint, newY_original));
            finalY = Math.max(minConstraint, Math.min(originalImage.height - 1, finalY)); 

            if (sourceRowYPositions[activeDragLine] !== finalY) {
                sourceRowYPositions[activeDragLine] = finalY;
                drawSourceCanvas();
                updateOutput();
            }
        }

        function handleMouseUp() {
            if (activeDragLine !== -1) {
                activeDragLine = -1;
                sourceCanvas.classList.remove('dragging');
                drawSourceCanvas();
            }
        }

        // --- Output Generation ---
        
        function getTransformedImage() {
            if (!originalImage) return null;

            const scale = parseFloat(scaleInput.value);
            const removeBg = removeBgCheck.checked;
            const erosion = removeBg ? parseInt(smoothEdgeInput.value) : 0;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = originalImage.width * scale;
            tempCanvas.height = originalImage.height * scale;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.imageSmoothingEnabled = false;
            tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height); 
            tempCtx.drawImage(originalImage, 0, 0, tempCanvas.width, tempCanvas.height); 

            if (removeBg) {
                const bgColor = getBackgroundColor(originalImage);
                removeBackground(tempCanvas, bgColor, erosion); 
            }

            return tempCanvas;
        }

        function getColumnOffsets() {
            const colOffsetX = [];
            document.querySelectorAll('.column-offset-x').forEach(input => colOffsetX.push(parseInt(input.value) || 0));
            const colOffsetY = [];
            document.querySelectorAll('.column-offset-y').forEach(input => colOffsetY.push(parseInt(input.value) || 0));
            return { colOffsetX, colOffsetY };
        }

        function generatePreview() {
            if (!originalImage || sourceRowYPositions.length < 2) return;
            
            const sourceRows = sourceRowYPositions.length - 1;
            const scaledSourceImage = getTransformedImage();
            if (!scaledSourceImage) return;

            previewGrid.innerHTML = '';
            
            const scale = parseFloat(scaleInput.value);
            const sourceW_original = originalImage.width / SOURCE_COLS;
            const scaledSourceW = sourceW_original * scale;
            
            const offsetX = parseInt(offsetXInput.value);
            const offsetY = parseInt(offsetYInput.value);
            const { colOffsetX, colOffsetY } = getColumnOffsets();

            // Centering calculation is moved outside the loop since it only depends on scale
            const horizontalCenter = (FINAL_SPRITE_WIDTH - scaledSourceW) / 2;

            for (let row = 0; row < sourceRows; row++) {
                const sourceY_original = sourceRowYPositions[row];
                const sourceH_original = sourceRowYPositions[row + 1] - sourceRowYPositions[row];

                const scaledSourceY = sourceY_original * scale;
                const scaledSourceH = sourceH_original * scale;
                
                // New: Vertical Bottom Alignment
                const verticalBottomAlignment = FINAL_SPRITE_HEIGHT - scaledSourceH;

                for (let col = 0; col < SOURCE_COLS; col++) {
                    const spriteCanvas = document.createElement('canvas');
                    spriteCanvas.width = FINAL_SPRITE_WIDTH;
                    spriteCanvas.height = FINAL_SPRITE_HEIGHT;
                    const spriteCtx = spriteCanvas.getContext('2d');
                    spriteCtx.imageSmoothingEnabled = false;
                    spriteCtx.clearRect(0, 0, FINAL_SPRITE_WIDTH, FINAL_SPRITE_HEIGHT); // Clear to transparent
                    
                    const srcX = col * scaledSourceW;

                    // Final Destination X and Y (Horizontal Center, Vertical Bottom Alignment, plus offsets)
                    const finalDestX = horizontalCenter + offsetX + colOffsetX[col];
                    const finalDestY = verticalBottomAlignment + offsetY + colOffsetY[col];

                    spriteCtx.drawImage(
                        scaledSourceImage, 
                        srcX, scaledSourceY, scaledSourceW, scaledSourceH, // Source rectangle
                        finalDestX, finalDestY, scaledSourceW, scaledSourceH  // Destination rectangle
                    );
                    
                    if (showTilesCheck.checked) {
                        drawIsometricTile(spriteCtx, 0, 0, FINAL_SPRITE_WIDTH, FINAL_SPRITE_HEIGHT);
                    }

                    const previewItem = document.createElement('div');
                    previewItem.className = 'preview-item';
                    previewItem.appendChild(spriteCanvas);
                    previewGrid.appendChild(previewItem);
                }
            }
        }
        
        function exportFixedSheet() {
            if (!originalImage || sourceRowYPositions.length < 2) return;
            
            const sourceRows = sourceRowYPositions.length - 1;
            
            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = FINAL_SPRITE_WIDTH * SOURCE_COLS;
            exportCanvas.height = FINAL_SPRITE_HEIGHT * sourceRows;
            const exportCtx = exportCanvas.getContext('2d');
            exportCtx.imageSmoothingEnabled = false;
            exportCtx.clearRect(0, 0, exportCanvas.width, exportCanvas.height);

            const scale = parseFloat(scaleInput.value);
            const offsetX = parseInt(offsetXInput.value);
            const offsetY = parseInt(offsetYInput.value);
            const { colOffsetX, colOffsetY } = getColumnOffsets();

            const scaledSourceImage = getTransformedImage();
            if (!scaledSourceImage) return;

            const sourceW_original = originalImage.width / SOURCE_COLS;
            const scaledSourceW = sourceW_original * scale;
            const horizontalCenter = (FINAL_SPRITE_WIDTH - scaledSourceW) / 2;

            for (let row = 0; row < sourceRows; row++) {
                const sourceY_original = sourceRowYPositions[row];
                const sourceH_original = sourceRowYPositions[row + 1] - sourceRowYPositions[row];

                const scaledSourceY = sourceY_original * scale;
                const scaledSourceH = sourceH_original * scale;
                const verticalBottomAlignment = FINAL_SPRITE_HEIGHT - scaledSourceH;

                for (let col = 0; col < SOURCE_COLS; col++) {
                    const destX = col * FINAL_SPRITE_WIDTH;
                    const destY = row * FINAL_SPRITE_HEIGHT;
                    
                    const srcX = col * scaledSourceW;

                    // Final Destination X and Y (Horizontal Center, Vertical Bottom Alignment, plus offsets)
                    const finalDestX = destX + horizontalCenter + offsetX + colOffsetX[col];
                    const finalDestY = destY + verticalBottomAlignment + offsetY + colOffsetY[col];

                    exportCtx.drawImage(
                        scaledSourceImage, 
                        srcX, scaledSourceY, scaledSourceW, scaledSourceH, 
                        finalDestX, finalDestY, scaledSourceW, scaledSourceH
                    );
                }
            }
            
            // The logic to draw the Isometric Tiles has been removed from the export function.

            // Export
            const link = document.createElement('a');
            link.download = 'custom-centered-sheet.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
        }
    </script>
