<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Sheet Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 0.85em;
        }
        
        .main-content {
            padding: 15px;
        }
        
        .workspace-section {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        
        .workspace-header {
            color: white;
            font-size: 1.2em;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .workspace-rows {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-height: 100px;
            background: rgba(255,255,255,0.1);
            border-radius: 6px;
            padding: 10px;
        }
        
        .workspace-empty {
            color: white;
            text-align: center;
            padding: 20px;
            opacity: 0.7;
            font-style: italic;
        }
        
        .upload-section {
            background: #f8f9fa;
            border: 3px dashed #667eea;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-section:hover {
            background: #e9ecef;
            border-color: #764ba2;
        }
        
        .upload-section input {
            display: none;
        }
        
        .upload-icon {
            font-size: 2em;
            margin-bottom: 8px;
        }
        
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
        }
        
        .btn-secondary {
            background: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5a6268;
        }
        
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background: #c82333;
        }
        
        .collections-section {
            margin-bottom: 20px;
        }
        
        .collection {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
            border: 2px solid #e9ecef;
        }
        
        .collection.collapsed .sprite-rows {
            display: none;
        }
        
        .collection-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #dee2e6;
            cursor: pointer;
            user-select: none;
        }
        
        .collection-header:hover {
            background: #e9ecef;
            margin: -5px -5px 10px -5px;
            padding: 5px 5px 13px 5px;
            border-radius: 6px;
        }
        
        .collection-name {
            font-weight: 600;
            color: #495057;
            font-size: 1em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .collection-toggle {
            font-size: 0.9em;
            transition: transform 0.3s;
        }
        
        .collection.collapsed .collection-toggle {
            transform: rotate(-90deg);
        }
        
        .sprite-rows {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .sprite-row {
            background: white;
            border-radius: 8px;
            padding: 8px;
            border: 2px solid #e9ecef;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sprite-row.dragging {
            opacity: 0.5;
            border-color: #667eea;
        }
        
        .sprite-row.drag-over {
            border-color: #28a745;
            background: #e7f9ed;
        }
        
        .row-header {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 60px;
        }
        
        .drag-handle {
            cursor: move;
            font-size: 1.2em;
            color: #6c757d;
        }
        
        .row-actions {
            display: flex;
            gap: 5px;
        }
        
        .btn-small {
            padding: 4px 8px;
            font-size: 0.8em;
        }
        
        .sprites-container {
            display: flex;
            gap: 5px;
            flex: 1;
        }
        
        .sprite-item {
            background: white;
            border-radius: 4px;
            padding: 3px;
            border: 1px solid #dee2e6;
        }
        
        .sprite-item canvas {
            max-width: 80px;
            height: auto;
            display: block;
            image-rendering: pixelated;
        }
        
        .info-box {
            background: #e7f3ff;
            border-left: 4px solid #667eea;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        
        .export-section {
            margin-top: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 8px;
            color: white;
        }
        
        .export-preview {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-top: 10px;
            text-align: center;
        }
        
        .export-preview canvas {
            max-width: 100%;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>

        <div class="header">

        <div class="header">
