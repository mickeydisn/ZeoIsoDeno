<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprite Sheet Editor</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #2a2a2a;
            color: #fff;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .controls {
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .btn {
            background: #4a90e2;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
            font-size: 14px;
        }
        .btn:hover {
            background: #357abd;
        }
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .file-input {
            display: inline-block;
            margin-right: 10px;
        }
        .main-area {
            display: flex;
            gap: 20px;
        }
        .sheet-panel {
            flex: 1;
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
        }
        .workspace-panel {
            width: 700px;
            background: #3a3a3a;
            padding: 15px;
            border-radius: 8px;
        }
        .panel-title {
            font-size: 18px;
            margin-bottom: 10px;
            color: #4a90e2;
        }
        .canvas-container {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 5px;
            display: inline-block;
            margin-top: 10px;
        }
        canvas {
            border: 1px solid #555;
            image-rendering: pixelated;
            cursor: crosshair;
        }
        #sheetCanvas {
            cursor: pointer;
        }
        #workspaceCanvas {
            background-image: 
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #222;
            position: relative;
        }
        .canvas-wrapper {
            position: relative;
            display: inline-block;
            overflow: hidden;
        }
        .cursor-overlay {
            position: absolute;
            pointer-events: none;
            border: 2px solid #fff;
            box-shadow: 0 0 0 1px #000;
            display: none;
        }
        .tools {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .tool-btn {
            padding: 8px 15px;
            background: #555;
            border: 2px solid #555;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }
        .tool-btn.active {
            background: #4a90e2;
            border-color: #4a90e2;
        }
        .color-picker {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
        }
        .color-display {
            width: 40px;
            height: 40px;
            border: 2px solid #fff;
            border-radius: 5px;
            cursor: pointer;
        }
        input[type="color"] {
            width: 100px;
            height: 40px;
            border: none;
            cursor: pointer;
        }
        .info {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            font-size: 12px;
        }
        .workspace-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .slider-control {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
        }
        .slider-control input[type="range"] {
            flex: 1;
        }
        .slider-control label {
            min-width: 80px;
        }
        .slider-control span {
            min-width: 30px;
            text-align: right;
        }
        .palette-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #555;
        }
        .palette-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, 40px);
            gap: 5px;
            margin: 10px 0;
            max-height: 200px;
            overflow-y: auto;
        }
        .palette-color {
            width: 40px;
            height: 40px;
            border: 2px solid #555;
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }
        .palette-color.selected {
            border-color: #4a90e2;
            box-shadow: 0 0 5px #4a90e2;
        }
        .palette-color .count {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(0,0,0,0.7);
            color: white;
            font-size: 10px;
            padding: 1px 3px;
            border-radius: 2px;
        }
        .merge-controls {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .threshold-control {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            margin-top: 10px;
        }
        .threshold-control input[type="range"] {
            flex: 1;
        }
        .sort-buttons {
            display: flex;
            gap: 5px;
            margin: 10px 0;
        }
        .sort-btn {
            padding: 5px 10px;
            background: #555;
            border: 1px solid #666;
            color: white;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
        }
        .sort-btn.active {
            background: #4a90e2;
            border-color: #4a90e2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sprite Sheet Editor</h1>
        
        <div class="controls">
            <input type="file" id="fileInput" accept="image/*" class="file-input">
            <button class="btn" id="saveBtn" disabled>Save Sprite Sheet</button>
        </div>

        <div class="main-area">
            <div class="sheet-panel">
                <div class="panel-title">Sprite Sheet (4 columns × 192×224px sprites)</div>
                <div class="canvas-container">
                    <canvas id="sheetCanvas"></canvas>
                </div>
                <div class="info" id="sheetInfo">Load an image to start editing</div>
            </div>

            <div class="workspace-panel">
                <div class="panel-title">Workspace Editor</div>
                
                <div class="tools">
                    <button class="tool-btn active" data-tool="paint">Paint</button>
                    <button class="tool-btn" data-tool="erase">Erase</button>
                    <button class="tool-btn" data-tool="pick">Pick Color</button>
                </div>

                <div class="color-picker">
                    <label>Color:</label>
                    <div class="color-display" id="colorDisplay"></div>
                    <input type="color" id="colorPicker" value="#000000">
                </div>

                <div class="slider-control">
                    <label>Brush Size:</label>
                    <input type="range" id="brushSize" min="1" max="10" value="1">
                    <span id="brushSizeValue">1</span>
                </div>

                <div class="slider-control">
                    <label>Zoom:</label>
                    <input type="range" id="zoomSlider" min="1" max="8" value="3">
                    <span id="zoomValue">3x</span>
                </div>

                <div class="canvas-container">
                    <div class="canvas-wrapper">
                        <canvas id="workspaceCanvas" width="192" height="224"></canvas>
                        <div class="cursor-overlay" id="cursorOverlay"></div>
                    </div>
                </div>

                <div class="workspace-actions">
                    <button class="btn" id="applyBtn" disabled>Apply to Sheet</button>
                    <button class="btn" id="clearBtn" disabled>Clear Workspace</button>
                </div>

                <div class="palette-section">
                    <div class="panel-title" style="font-size: 16px;">Color Palette</div>
                    
                    <div class="sort-buttons">
                        <button class="sort-btn active" data-sort="count">Sort by Count</button>
                        <button class="sort-btn" data-sort="hue">Sort by Hue</button>
                        <button class="sort-btn" data-sort="brightness">Sort by Brightness</button>
                    </div>
                    
                    <div class="palette-grid" id="paletteGrid"></div>
                    
                    <div class="threshold-control">
                        <label>Auto-merge threshold:</label>
                        <input type="range" id="mergeThreshold" min="0" max="50" value="10">
                        <span id="thresholdValue">10</span>
                    </div>
                    
                    <div class="merge-controls">
                        <button class="btn" id="extractPaletteBtn" disabled>Extract Palette</button>
                        <button class="btn" id="mergeColorsBtn" disabled>Merge Selected</button>
                        <button class="btn" id="autoMergeBtn" disabled>Auto-Merge Similar</button>
                    </div>
                </div>

                <div class="info" id="workspaceInfo">Select a sprite from the sheet to edit</div>
            </div>
        </div>
    </div>

    <script>
        const SPRITE_WIDTH = 192;
        const SPRITE_HEIGHT = 224;
        const COLS = 4;
        let PIXEL_SIZE = 3; // Scale factor for workspace
        
        let sheetImage = null;
        let sheetCanvas = document.getElementById('sheetCanvas');
        let sheetCtx = sheetCanvas.getContext('2d', { willReadFrequently: true });
        let workspaceCanvas = document.getElementById('workspaceCanvas');
        let workspaceCtx = workspaceCanvas.getContext('2d', { willReadFrequently: true });
        let cursorOverlay = document.getElementById('cursorOverlay');
        
        // Set workspace to scaled size
        workspaceCanvas.width = SPRITE_WIDTH;
        workspaceCanvas.height = SPRITE_HEIGHT;
        updateCanvasScale();
        
        let currentTool = 'paint';
        let currentColor = '#000000';
        let brushSize = 1;
        let selectedSprite = null;
        let isDrawing = false;
        let rows = 0;
        let colorPalette = {};
        let selectedColors = new Set();
        let currentSort = 'count';

        function updateCanvasScale() {
            workspaceCanvas.style.width = (SPRITE_WIDTH * PIXEL_SIZE) + 'px';
            workspaceCanvas.style.height = (SPRITE_HEIGHT * PIXEL_SIZE) + 'px';
        }

        // File input
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        sheetImage = img;
                        rows = Math.ceil(img.height / SPRITE_HEIGHT);
                        
                        sheetCanvas.width = img.width;
                        sheetCanvas.height = img.height;
                        sheetCtx.drawImage(img, 0, 0);
                        
                        drawGrid();
                        document.getElementById('sheetInfo').textContent = 
                            `Image loaded: ${img.width}×${img.height}px | ${COLS} columns × ${rows} rows`;
                        document.getElementById('saveBtn').disabled = false;
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Draw grid on sheet
        function drawGrid() {
            sheetCtx.strokeStyle = 'rgba(255, 0, 0, 0.5)';
            sheetCtx.lineWidth = 1;
            
            for (let row = 0; row <= rows; row++) {
                sheetCtx.beginPath();
                sheetCtx.moveTo(0, row * SPRITE_HEIGHT);
                sheetCtx.lineTo(sheetCanvas.width, row * SPRITE_HEIGHT);
                sheetCtx.stroke();
            }
            
            for (let col = 0; col <= COLS; col++) {
                sheetCtx.beginPath();
                sheetCtx.moveTo(col * SPRITE_WIDTH, 0);
                sheetCtx.lineTo(col * SPRITE_WIDTH, sheetCanvas.height);
                sheetCtx.stroke();
            }
        }

        // Select sprite from sheet
        sheetCanvas.addEventListener('click', function(e) {
            if (!sheetImage) return;
            
            const rect = sheetCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const col = Math.floor(x / SPRITE_WIDTH);
            const row = Math.floor(y / SPRITE_HEIGHT);
            
            if (col < COLS && row < rows) {
                selectedSprite = { col, row };
                
                const sx = col * SPRITE_WIDTH;
                const sy = row * SPRITE_HEIGHT;
                
                workspaceCtx.clearRect(0, 0, SPRITE_WIDTH, SPRITE_HEIGHT);
                workspaceCtx.drawImage(sheetImage, sx, sy, SPRITE_WIDTH, SPRITE_HEIGHT, 0, 0, SPRITE_WIDTH, SPRITE_HEIGHT);
                
                document.getElementById('workspaceInfo').textContent = 
                    `Editing sprite: Col ${col + 1}, Row ${row + 1}`;
                document.getElementById('applyBtn').disabled = false;
                document.getElementById('clearBtn').disabled = false;
                document.getElementById('extractPaletteBtn').disabled = false;
                document.getElementById('autoMergeBtn').disabled = false;
                
                extractPalette();
            }
        });

        // Tool selection
        document.querySelectorAll('.tool-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTool = this.dataset.tool;
            });
        });

        // Color picker
        document.getElementById('colorPicker').addEventListener('input', function(e) {
            currentColor = e.target.value;
            document.getElementById('colorDisplay').style.backgroundColor = currentColor;
        });

        document.getElementById('colorDisplay').addEventListener('click', function() {
            document.getElementById('colorPicker').click();
        });

        // Initial color display
        document.getElementById('colorDisplay').style.backgroundColor = currentColor;

        // Brush size control
        document.getElementById('brushSize').addEventListener('input', function(e) {
            brushSize = parseInt(e.target.value);
            document.getElementById('brushSizeValue').textContent = brushSize;
        });

        // Zoom control
        document.getElementById('zoomSlider').addEventListener('input', function(e) {
            PIXEL_SIZE = parseInt(e.target.value);
            document.getElementById('zoomValue').textContent = PIXEL_SIZE + 'x';
            updateCanvasScale();
        });

        // Workspace drawing
        workspaceCanvas.addEventListener('mousedown', function(e) {
            if (selectedSprite === null) return;
            isDrawing = true;
            draw(e);
        });

        workspaceCanvas.addEventListener('mousemove', function(e) {
            updateCursor(e);
            if (!isDrawing) return;
            draw(e);
        });

        workspaceCanvas.addEventListener('mouseup', function() {
            isDrawing = false;
        });

        workspaceCanvas.addEventListener('mouseleave', function() {
            isDrawing = false;
            cursorOverlay.style.display = 'none';
        });

        workspaceCanvas.addEventListener('mouseenter', function() {
            cursorOverlay.style.display = 'block';
        });

        function updateCursor(e) {
            const rect = workspaceCanvas.getBoundingClientRect();
            const scaleX = workspaceCanvas.width / rect.width;
            const scaleY = workspaceCanvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            
            const displayX = (x / scaleX);
            const displayY = (y / scaleY);
            const cursorDisplaySize = (brushSize / scaleX);
            
            cursorOverlay.style.left = displayX + 'px';
            cursorOverlay.style.top = displayY + 'px';
            cursorOverlay.style.width = cursorDisplaySize + 'px';
            cursorOverlay.style.height = cursorDisplaySize + 'px';
        }

        function draw(e) {
            const rect = workspaceCanvas.getBoundingClientRect();
            const scaleX = workspaceCanvas.width / rect.width;
            const scaleY = workspaceCanvas.height / rect.height;
            const x = Math.floor((e.clientX - rect.left) * scaleX);
            const y = Math.floor((e.clientY - rect.top) * scaleY);
            
            const halfSize = Math.floor(brushSize / 2);
            
            if (currentTool === 'paint') {
                workspaceCtx.fillStyle = currentColor;
                for (let i = -halfSize; i <= halfSize; i++) {
                    for (let j = -halfSize; j <= halfSize; j++) {
                        const px = x + i;
                        const py = y + j;
                        if (px >= 0 && px < SPRITE_WIDTH && py >= 0 && py < SPRITE_HEIGHT) {
                            workspaceCtx.fillRect(px, py, 1, 1);
                        }
                    }
                }
            } else if (currentTool === 'erase') {
                for (let i = -halfSize; i <= halfSize; i++) {
                    for (let j = -halfSize; j <= halfSize; j++) {
                        const px = x + i;
                        const py = y + j;
                        if (px >= 0 && px < SPRITE_WIDTH && py >= 0 && py < SPRITE_HEIGHT) {
                            workspaceCtx.clearRect(px, py, 1, 1);
                        }
                    }
                }
            } else if (currentTool === 'pick') {
                const pixel = workspaceCtx.getImageData(x, y, 1, 1).data;
                if (pixel[3] > 0) {
                    const hex = '#' + [pixel[0], pixel[1], pixel[2]].map(v => {
                        return v.toString(16).padStart(2, '0');
                    }).join('');
                    currentColor = hex;
                    document.getElementById('colorPicker').value = hex;
                    document.getElementById('colorDisplay').style.backgroundColor = hex;
                }
            }
        }

        // Apply changes to sheet
        document.getElementById('applyBtn').addEventListener('click', function() {
            if (selectedSprite === null) return;
            
            const sx = selectedSprite.col * SPRITE_WIDTH;
            const sy = selectedSprite.row * SPRITE_HEIGHT;
            
            sheetCtx.clearRect(sx, sy, SPRITE_WIDTH, SPRITE_HEIGHT);
            sheetCtx.drawImage(workspaceCanvas, sx, sy);
            
            drawGrid();
        });

        // Clear workspace
        document.getElementById('clearBtn').addEventListener('click', function() {
            workspaceCtx.clearRect(0, 0, SPRITE_WIDTH, SPRITE_HEIGHT);
        });

        // Extract color palette
        document.getElementById('extractPaletteBtn').addEventListener('click', function() {
            extractPalette();
        });

        // Sort buttons
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentSort = this.dataset.sort;
                displayPalette();
            });
        });

        // Threshold slider
        document.getElementById('mergeThreshold').addEventListener('input', function(e) {
            document.getElementById('thresholdValue').textContent = e.target.value;
        });

        function extractPalette() {
            colorPalette = {};
            selectedColors.clear();
            
            const imageData = workspaceCtx.getImageData(0, 0, SPRITE_WIDTH, SPRITE_HEIGHT);
            const pixels = imageData.data;
            
            for (let i = 0; i < pixels.length; i += 4) {
                const a = pixels[i + 3];
                if (a > 0) {
                    const r = pixels[i];
                    const g = pixels[i + 1];
                    const b = pixels[i + 2];
                    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
                    
                    if (!colorPalette[hex]) {
                        colorPalette[hex] = 0;
                    }
                    colorPalette[hex]++;
                }
            }
            
            displayPalette();
        }

        function displayPalette() {
            const grid = document.getElementById('paletteGrid');
            grid.innerHTML = '';
            
            let sortedColors;
            
            if (currentSort === 'count') {
                sortedColors = Object.entries(colorPalette).sort((a, b) => b[1] - a[1]);
            } else if (currentSort === 'hue') {
                sortedColors = Object.entries(colorPalette).sort((a, b) => {
                    const hslA = rgbToHsl(hexToRgb(a[0]));
                    const hslB = rgbToHsl(hexToRgb(b[0]));
                    return hslA.h - hslB.h;
                });
            } else if (currentSort === 'brightness') {
                sortedColors = Object.entries(colorPalette).sort((a, b) => {
                    const hslA = rgbToHsl(hexToRgb(a[0]));
                    const hslB = rgbToHsl(hexToRgb(b[0]));
                    return hslB.l - hslA.l;
                });
            }
            
            sortedColors.forEach(([color, count]) => {
                const colorDiv = document.createElement('div');
                colorDiv.className = 'palette-color';
                colorDiv.style.backgroundColor = color;
                colorDiv.innerHTML = `<span class="count">${count}</span>`;
                
                if (selectedColors.has(color)) {
                    colorDiv.classList.add('selected');
                }
                
                colorDiv.addEventListener('click', function() {
                    if (selectedColors.has(color)) {
                        selectedColors.delete(color);
                        colorDiv.classList.remove('selected');
                    } else {
                        selectedColors.add(color);
                        colorDiv.classList.add('selected');
                    }
                    
                    document.getElementById('mergeColorsBtn').disabled = selectedColors.size < 2;
                });
                
                grid.appendChild(colorDiv);
            });
            
            document.getElementById('mergeColorsBtn').disabled = selectedColors.size < 2;
        }

        // Merge selected colors
        document.getElementById('mergeColorsBtn').addEventListener('click', function() {
            if (selectedColors.size < 2) return;
            mergeColors(Array.from(selectedColors));
        });

        // Auto-merge similar colors
        document.getElementById('autoMergeBtn').addEventListener('click', function() {
            const threshold = parseInt(document.getElementById('mergeThreshold').value);
            autoMergeSimilarColors(threshold);
        });

        function autoMergeSimilarColors(threshold) {
            const colors = Object.keys(colorPalette);
            const merged = new Set();
            const mergeGroups = [];
            
            for (let i = 0; i < colors.length; i++) {
                if (merged.has(colors[i])) continue;
                
                const group = [colors[i]];
                const rgb1 = hexToRgb(colors[i]);
                
                for (let j = i + 1; j < colors.length; j++) {
                    if (merged.has(colors[j])) continue;
                    
                    const rgb2 = hexToRgb(colors[j]);
                    const distance = colorDistance(rgb1, rgb2);
                    
                    if (distance <= threshold) {
                        group.push(colors[j]);
                        merged.add(colors[j]);
                    }
                }
                
                if (group.length > 1) {
                    mergeGroups.push(group);
                }
                merged.add(colors[i]);
            }
            
            if (mergeGroups.length === 0) {
                return;
            }
            
            mergeGroups.forEach(group => {
                mergeColors(group);
            });
            
        }

        function colorDistance(rgb1, rgb2) {
            const dr = rgb1.r - rgb2.r;
            const dg = rgb1.g - rgb2.g;
            const db = rgb1.b - rgb2.b;
            return Math.sqrt(dr * dr + dg * dg + db * db);
        }

        function mergeColors(colorsToMerge) {
            const targetColor = colorsToMerge[0];
            const imageData = workspaceCtx.getImageData(0, 0, SPRITE_WIDTH, SPRITE_HEIGHT);
            const pixels = imageData.data;
            const targetRGB = hexToRgb(targetColor);
            
            for (let i = 0; i < pixels.length; i += 4) {
                const r = pixels[i];
                const g = pixels[i + 1];
                const b = pixels[i + 2];
                const a = pixels[i + 3];
                
                if (a > 0) {
                    const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
                    
                    if (colorsToMerge.includes(hex)) {
                        pixels[i] = targetRGB.r;
                        pixels[i + 1] = targetRGB.g;
                        pixels[i + 2] = targetRGB.b;
                    }
                }
            }
            
            workspaceCtx.putImageData(imageData, 0, 0);
            extractPalette();
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : null;
        }

        function rgbToHsl(rgb) {
            const r = rgb.r / 255;
            const g = rgb.g / 255;
            const b = rgb.b / 255;
            
            const max = Math.max(r, g, b);
            const min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                
                switch (max) {
                    case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                    case g: h = ((b - r) / d + 2) / 6; break;
                    case b: h = ((r - g) / d + 4) / 6; break;
                }
            }
            
            return { h: h * 360, s: s, l: l };
        }

        // Save sprite sheet
        document.getElementById('saveBtn').addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'sprite-sheet-edited.png';
            link.href = sheetCanvas.toDataURL();
            link.click();
        });
    </script>
