<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Building Config Editor</title>
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div class="editor-layout">
    <header class="header">
      <h1>Building Config Editor</h1>
    </header>

    <div id="loading" class="loading">Loading...</div>
    <div id="error-banner" class="error-banner hidden"></div>

    <div class="content-wrapper">
      <div id="library-panel" class="sidebar"></div>
      <div id="main-panel" class="main-content">
        <div class="placeholder-content">
          <h2>Welcome to Building Config Editor</h2>
          <p>Select a configuration from the library to start editing.</p>
          <p>Use the Extract All button to load TypeScript configurations.</p>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-content"></div>
  </div>

  <!-- State Management -->
  <script type="module" src="js/state.ts"></script>
  <!-- API Client -->
  <script type="module" src="js/api.ts"></script>
  <!-- Components -->
  <script type="module" src="js/components/weightTable.ts"></script>
  <script type="module" src="js/components/faceLinkTable.ts"></script>
  <!-- Library Panel -->
  <script type="module" src="js/panels/library.ts"></script>
  <!-- Building Editor Panel -->
  <script type="module" src="js/panels/building.ts"></script>
  <script type="module">
    import { stateManager } from './js/state.ts';
    import { apiClient } from './js/api.ts';
    import { BuildingEditorPanel } from './js/panels/building.ts';

    // Initialize building editor panel
    const mainPanel = document.getElementById('main-panel');
    if (mainPanel) {
      const buildingPanel = new BuildingEditorPanel(stateManager, apiClient);
      
      // Subscribe to active config changes
      stateManager.subscribe(() => {
        const state = stateManager.getState();
        if (state.activeConfig?.type === 'building') {
          buildingPanel.render(mainPanel);
        } else if (state.activeConfig?.type === null || state.activeConfig?.data === null) {
          // Show placeholder when no config is selected
          mainPanel.innerHTML = `
            <div class="placeholder-content">
              <h2>Welcome to Building Config Editor</h2>
              <p>Select a configuration from the library to start editing.</p>
              <p>Use the Extract All button to load TypeScript configurations.</p>
            </div>
          `;
        }
      });
    }
  </script>
</body>
</html>
