<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO CITY</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --panel: rgba(12, 12, 20, 0.85);
    --border: rgba(255,255,255,0.08);
    --accent: #e8ff47;
    --accent2: #47c8ff;
    --text: #e8e8f0;
    --dim: rgba(232,232,240,0.45);
  }

  body {
    background: var(--bg);
    font-family: 'Space Mono', monospace;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  canvas { display: block; }

  /* ── HEADER ── */
  header {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 28px;
    background: linear-gradient(to bottom, rgba(10,10,15,0.9) 0%, transparent 100%);
    pointer-events: none;
  }
  header h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1.4rem;
    letter-spacing: 0.18em;
    color: var(--accent);
    text-transform: uppercase;
  }
  header span {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 0.1em;
  }

  /* ── PANEL ── */
  #panel {
    position: fixed;
    right: 0; top: 0; bottom: 0;
    width: 260px;
    z-index: 20;
    background: var(--panel);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-left: 1px solid var(--border);
    padding: 80px 22px 30px;
    display: flex;
    flex-direction: column;
    gap: 28px;
    overflow-y: auto;
    transition: transform 0.35s cubic-bezier(.16,1,.3,1);
  }
  #panel.hidden { transform: translateX(100%); }

  .panel-section { display: flex; flex-direction: column; gap: 14px; }

  .panel-label {
    font-family: 'Syne', sans-serif;
    font-size: 0.6rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent);
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .control-row label {
    font-size: 0.65rem;
    color: var(--dim);
    letter-spacing: 0.05em;
    white-space: nowrap;
  }
  .control-row .val {
    font-size: 0.65rem;
    color: var(--accent2);
    min-width: 38px;
    text-align: right;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
    margin-top: 4px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
    box-shadow: 0 0 8px rgba(232,255,71,0.6);
    cursor: pointer;
    transition: transform 0.15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  /* Toggle button */
  #toggle-panel {
    position: fixed;
    right: 270px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 25;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--accent);
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    cursor: pointer;
    padding: 10px 6px;
    letter-spacing: 0.12em;
    writing-mode: vertical-rl;
    text-orientation: mixed;
    border-radius: 4px 0 0 4px;
    backdrop-filter: blur(10px);
    transition: right 0.35s cubic-bezier(.16,1,.3,1), background 0.2s;
  }
  #toggle-panel:hover { background: rgba(232,255,71,0.1); }
  #toggle-panel.shifted { right: 10px; }

  /* Bottom status */
  #status {
    position: fixed;
    bottom: 16px; left: 24px;
    font-size: 0.58rem;
    color: var(--dim);
    letter-spacing: 0.08em;
    z-index: 10;
    pointer-events: none;
  }

  /* FPS display */
  #fps {
    position: fixed;
    top: 18px; left: 24px;
    font-size: 0.58rem;
    color: var(--accent2);
    letter-spacing: 0.08em;
    z-index: 10;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<header>
  <h1>ISO CITY</h1>
  <span>40 × 40 · THREE.JS · TILES</span>
</header>

<div id="fps">FPS: 0</div>

<button id="toggle-panel">CONFIG</button>

<div id="panel">
  <!-- CAMERA -->
  <div class="panel-section">
    <div class="panel-label">Camera</div>
    <div class="control-row">
      <label>Zoom</label>
      <span class="val" id="val-zoom">1.0</span>
    </div>
    <input type="range" id="sl-zoom" min="0.3" max="3" step="0.05" value="1">

    <div class="control-row">
      <label>Rotation</label>
      <span class="val" id="val-rot">45°</span>
    </div>
    <input type="range" id="sl-rot" min="0" max="360" step="1" value="45">

    <div class="control-row">
      <label>Tilt</label>
      <span class="val" id="val-tilt">55°</span>
    </div>
    <input type="range" id="sl-tilt" min="10" max="89" step="1" value="55">
  </div>

  <!-- DAYTIME -->
  <div class="panel-section">
    <div class="panel-label">Daytime</div>
    <div class="control-row">
      <label>Hour</label>
      <span class="val" id="val-hour">12:00</span>
    </div>
    <input type="range" id="sl-hour" min="0" max="24" step="0.1" value="12">

    <div class="control-row">
      <label>Sun intensity</label>
      <span class="val" id="val-sun">1.2</span>
    </div>
    <input type="range" id="sl-sun" min="0" max="3" step="0.05" value="1.2">
  </div>

  <!-- POSITION -->
  <div class="panel-section">
    <div class="panel-label">Position</div>
    <div class="control-row">
      <label>X</label>
      <span class="val" id="val-posx">0</span>
    </div>
    <input type="range" id="sl-posx" min="-50" max="50" step="1" value="0">

    <div class="control-row">
      <label>Y</label>
      <span class="val" id="val-posy">-15</span>
    </div>
    <input type="range" id="sl-posy" min="-50" max="50" step="1" value="-15">

    <div class="control-row">
      <label>Z</label>
      <span class="val" id="val-posz">0</span>
    </div>
    <input type="range" id="sl-posz" min="-50" max="50" step="1" value="0">
  </div>

  <!-- POST -->
  <div class="panel-section">
    <div class="panel-label">Post-FX</div>
    <div class="control-row">
      <label>Fog density</label>
      <span class="val" id="val-fog">0.008</span>
    </div>
    <input type="range" id="sl-fog" min="0" max="0.06" step="0.001" value="0.008">

    <div class="control-row">
      <label>Vignette</label>
      <span class="val" id="val-vig">0.4</span>
    </div>
    <input type="range" id="sl-vig" min="0" max="1" step="0.02" value="0.4">
  </div>
</div>

<div id="status">drag to orbit · scroll to zoom · arrow keys to move grid</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function() {
  // ─── STATE ───────────────────────────────────────────────────────────────
  const state = {
    zoom: 1, rot: 45, tilt: 55,
    hour: 12, sunIntensity: 1.2,
    fog: 0.008, vignette: 0.4,
    centreX: 0, centreY: 0,
    posX: 0, posY: -15, posZ: 0
  };

  // ─── THREE SETUP ─────────────────────────────────────────────────────────
  const container = document.getElementById('canvas-container');
  const W = () => window.innerWidth, H = () => window.innerHeight;

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W(), H());
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.1;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0a1e, state.fog);

  // Orthographic camera for true iso feel
  let aspect = W() / H();
  const frustumSize = 40;
  const camera = new THREE.OrthographicCamera(
    -frustumSize * aspect / 2, frustumSize * aspect / 2,
    frustumSize / 2, -frustumSize / 2, 0.1, 1000
  );

  function updateCamera() {
    const r = state.rot * Math.PI / 180;
    const t = state.tilt * Math.PI / 180;
    const dist = 80 / state.zoom;
    camera.position.set(
      Math.sin(r) * Math.cos(t) * dist,
      Math.sin(t) * dist,
      Math.cos(r) * Math.cos(t) * dist
    );
    camera.lookAt(0, 2, 0);
    const s = 1 / state.zoom;
    const asp = W() / H();
    camera.left   = -frustumSize * asp / 2 * s;
    camera.right  =  frustumSize * asp / 2 * s;
    camera.top    =  frustumSize / 2 * s;
    camera.bottom = -frustumSize / 2 * s;
    camera.updateProjectionMatrix();
  }
  updateCamera();

  // ─── LIGHTS ──────────────────────────────────────────────────────────────
  const ambient = new THREE.AmbientLight(0xffffff, 0.3);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xfff5e0, 1.2);
  sun.castShadow = true;
  sun.shadow.mapSize.width = 2048;
  sun.shadow.mapSize.height = 2048;
  sun.shadow.camera.near = 0.5;
  sun.shadow.camera.far = 300;
  sun.shadow.camera.left = -40;
  sun.shadow.camera.right = 40;
  sun.shadow.camera.top = 40;
  sun.shadow.camera.bottom = -40;
  sun.shadow.bias = -0.001;
  sun.shadow.normalBias = 0.02;
  scene.add(sun);

  // Hemisphere fill
  const hemi = new THREE.HemisphereLight(0x87ceeb, 0x3a2a1a, 0.4);
  scene.add(hemi);

  function updateSunByHour(h) {
    // h in [0,24]
    const angle = (h / 24) * Math.PI * 2 - Math.PI / 2;
    const elevation = Math.sin((h / 24) * Math.PI) * 60;
    const azimuth = angle;
    const dist = 60;
    sun.position.set(
      Math.cos(azimuth) * dist,
      elevation,
      Math.sin(azimuth) * dist
    );

    // Sky + fog color by time
    const t = Math.max(0, Math.sin((h / 24) * Math.PI));
    const night = new THREE.Color(0x020410);
    const dawn  = new THREE.Color(0xff7043);
    const day   = new THREE.Color(0x87ceeb);
    let sky;
    if (h < 6 || h > 18) {
      sky = night.clone();
      const blend = h < 6 ? h / 6 : (24 - h) / 6;
      sky.lerp(dawn, blend * 0.5);
    } else if (h < 8) {
      sky = dawn.clone().lerp(day, (h - 6) / 2);
    } else if (h > 16) {
      sky = day.clone().lerp(dawn, (h - 16) / 2);
    } else {
      sky = day.clone();
    }
    renderer.setClearColor(sky, 1);
    scene.fog.color.copy(sky);

    // Sun color
    if (t < 0.15) {
      sun.color.setHex(0x334488); // moonlight
    } else if (t < 0.35) {
      sun.color.setHex(0xff8844); // golden
    } else {
      sun.color.setHex(0xfff5e0);  // daylight
    }

    ambient.color.copy(sky).multiplyScalar(0.5);
    ambient.intensity = 0.2 + t * 0.4;
    hemi.intensity = 0.1 + t * 0.5;
    sun.intensity = state.sunIntensity * Math.max(0, t);
  }
  // updateSunByHour(state.hour);

  // ─── TILE RENDERING ──────────────────────────────────────────────────────
  const TILE_SIZE = 1;  // Base size of each tile
  const TILE_HEIGHT_SCALE = 0.25;

  // City group for tiles
  let cityGroup = new THREE.Group();
  cityGroup.position.set(0, -15, 0);
  scene.add(cityGroup);

  // Store current tile meshes for cleanup
  let currentTileMeshes = [];

  // Render tiles from serialized tile data as a connected terrain floor
  function renderTiles(tilesMatrix) {
    // Clear existing tiles
    for (const mesh of currentTileMeshes) {
      cityGroup.remove(mesh);
      if (mesh.geometry) mesh.geometry.dispose();
      if (mesh.material) mesh.material.dispose();
    }
    currentTileMeshes = [];

    if (!tilesMatrix || !tilesMatrix.tiles) return;

    const { size, avgLvl, tiles } = tilesMatrix;

    // Collect vertex positions and colors
    const positions = [];
    const colors = [];
    const indices = [];

    // Create a vertex for each tile
    for (let x = 0; x < size; x++) {
      for (let y = 0; y < size; y++) {
        const tile = tiles[x]?.[y];
        const height = tile ? Math.max(-30.1, (tile.lvl - avgLvl) * TILE_HEIGHT_SCALE) : 0;

        // Position: terrain point on the floor, Y based on height
        const px = x - size / 2;
        const py = height;
        const pz = y - size / 2;
        positions.push(px, py, pz);

        // Color from tile data
        if (tile) {
          const [r, g, b] = tile.color;
          colors.push(r / 255, g / 255, b / 255);
        } else {
          colors.push(0.2, 0.2, 0.2);
        }
      }
    }

    // Create triangle indices to connect adjacent vertices into a mesh
    for (let x = 0; x < size - 1; x++) {
      for (let y = 0; y < size - 1; y++) {
        const topLeft = x * size + y;
        const topRight = (x + 1) * size + y;
        const bottomLeft = x * size + (y + 1);
        const bottomRight = (x + 1) * size + (y + 1);

        // Two triangles per quad
        indices.push(topLeft, bottomLeft, topRight);
        indices.push(topRight, bottomLeft, bottomRight);
      }
    }

    // Create buffer geometry with connected triangles
    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geometry.setIndex(indices);
    geometry.computeVertexNormals();

    const material = new THREE.MeshStandardMaterial({
      vertexColors: true,
      roughness: 0.5,
      // metalness: 0.3,
      side: THREE.DoubleSide,
    });

    const mesh = new THREE.Mesh(geometry, material);
    mesh.receiveShadow = true;
    cityGroup.add(mesh);
    currentTileMeshes.push(mesh);
  }

  // ─── GAME WORKER ─────────────────────────────────────────────────────────
  const gameWorker = new Worker("./js/gameWorker.ts", { type: "module" });

  // Message handler
  const handlers = new Map();
  gameWorker.onmessage = (e) => {
    const handler = handlers.get(e.data.action);
    if (handler) handler(e.data);
  };

  function send(data) {
    gameWorker.postMessage(data);
  }

  // Initialize worker
  handlers.set("callback_initWorker", (data) => {
    console.log("✅ Game Worker initialized!");
    send({
      action: "initCanvasMap",
      width: 1600,
      height: 800,
      mapConf: {
        mapGridSize: 200,
        mapGridTileScale: 1/2,
        mapGridMod: 1,
      },
    });
  });

  handlers.set("callback_initCanvasMap", (data) => {
    console.log("✅ Canvas Map Initialized!");
    send({ action: "startRender" });
    // send({
    //   action: "gridClick",
    //   x: -19,
    //   y: 70,
    // });
  });

  handlers.set("drawUpdate", (data) => {
    const { centreX, centreY, tilesMatrix } = data;
    state.centreX = centreX;
    state.centreY = centreY;

    if (tilesMatrix) {
      renderTiles(tilesMatrix);
    }
  });

  handlers.set("FPS", (data) => {
    document.getElementById("fps").textContent = `FPS: ${data.fps}`;
  });

  // Start worker
  send({ action: "initWorker" });

  // ─── KEYBOARD CONTROLS ───────────────────────────────────────────────────
  const MOVE_STEP = 2;
  
  window.addEventListener('keydown', (e) => {
    let moved = false;
    switch (e.key) {
      case 'ArrowUp':
        state.centreY -= MOVE_STEP;
        moved = true;
        break;
      case 'ArrowDown':
        state.centreY += MOVE_STEP;
        moved = true;
        break;
      case 'ArrowLeft':
        state.centreX -= MOVE_STEP;
        moved = true;
        break;
      case 'ArrowRight':
        state.centreX += MOVE_STEP;
        moved = true;
        break;
    }
    
    if (moved) {
      e.preventDefault();
      send({
        action: "setCenter",
        x: state.centreX,
        y: state.centreY,
      });
    }
  });

  // ─── ORBIT DRAG ───────────────────────────────────────────────────────────
  let drag = null;
  renderer.domElement.addEventListener('mousedown', e => {
    drag = { x: e.clientX, y: e.clientY, rot: state.rot, tilt: state.tilt };
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    state.rot  = drag.rot  - (e.clientX - drag.x) * 0.4;
    state.tilt = Math.max(10, Math.min(89, drag.tilt + (e.clientY - drag.y) * 0.3));
    document.getElementById('sl-rot').value = ((state.rot % 360) + 360) % 360;
    document.getElementById('sl-tilt').value = state.tilt;
    document.getElementById('val-rot').textContent = (((state.rot % 360) + 360) % 360 | 0) + '°';
    document.getElementById('val-tilt').textContent = (state.tilt | 0) + '°';
    updateCamera();
  });
  window.addEventListener('mouseup', () => drag = null);
  renderer.domElement.addEventListener('wheel', e => {
    state.zoom = Math.max(0.3, Math.min(3, state.zoom - e.deltaY * 0.001));
    document.getElementById('sl-zoom').value = state.zoom;
    document.getElementById('val-zoom').textContent = state.zoom.toFixed(2);
    updateCamera();
  }, { passive: true });

  // Touch
  let lastTouch = null;
  renderer.domElement.addEventListener('touchstart', e => {
    if (e.touches.length === 1) lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY, rot: state.rot, tilt: state.tilt };
  });
  renderer.domElement.addEventListener('touchmove', e => {
    if (!lastTouch || e.touches.length !== 1) return;
    e.preventDefault();
    state.rot  = lastTouch.rot  - (e.touches[0].clientX - lastTouch.x) * 0.4;
    state.tilt = Math.max(10, Math.min(89, lastTouch.tilt + (e.touches[0].clientY - lastTouch.y) * 0.3));
    updateCamera();
  }, { passive: false });

  // ─── SLIDERS ─────────────────────────────────────────────────────────────
  function bindSlider(id, key, valId, fmt, cb) {
    const el = document.getElementById(id);
    el.addEventListener('input', () => {
      state[key] = parseFloat(el.value);
      document.getElementById(valId).textContent = fmt(state[key]);
      if (cb) cb();
    });
  }

  bindSlider('sl-zoom', 'zoom', 'val-zoom', v => v.toFixed(2), updateCamera);
  bindSlider('sl-rot',  'rot',  'val-rot',  v => (v|0) + '°', updateCamera);
  bindSlider('sl-tilt', 'tilt', 'val-tilt', v => (v|0) + '°', updateCamera);
  bindSlider('sl-sun',  'sunIntensity', 'val-sun', v => v.toFixed(2), () => { sun.intensity = state.sunIntensity * Math.max(0, Math.sin((state.hour / 24) * Math.PI)); });
  bindSlider('sl-fog',  'fog',  'val-fog',  v => v.toFixed(3), () => { scene.fog.density = state.fog; });
  bindSlider('sl-hour', 'hour', 'val-hour', v => {
    const hh = Math.floor(v), mm = Math.round((v - hh) * 60);
    return hh.toString().padStart(2,'0') + ':' + mm.toString().padStart(2,'0');
  }, () => { updateSunByHour(state.hour); });

  // Position sliders
  bindSlider('sl-posx', 'posX', 'val-posx', v => v|0, () => {
    cityGroup.position.set(state.posX, state.posY, state.posZ);
  });
  bindSlider('sl-posy', 'posY', 'val-posy', v => v|0, () => {
    cityGroup.position.set(state.posX, state.posY, state.posZ);
  });
  bindSlider('sl-posz', 'posZ', 'val-posz', v => v|0, () => {
    cityGroup.position.set(state.posX, state.posY, state.posZ);
  });

  // ─── PANEL TOGGLE ─────────────────────────────────────────────────────────
  const panel = document.getElementById('panel');
  const toggleBtn = document.getElementById('toggle-panel');
  toggleBtn.addEventListener('click', () => {
    panel.classList.toggle('hidden');
    toggleBtn.classList.toggle('shifted');
  });

  // ─── VIGNETTE OVERLAY ─────────────────────────────────────────────────────
  const vigCanvas = document.createElement('canvas');
  vigCanvas.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:5;';
  document.body.appendChild(vigCanvas);

  function drawVignette() {
    vigCanvas.width = W(); vigCanvas.height = H();
    const ctx = vigCanvas.getContext('2d');
    const cx = W() / 2, cy = H() / 2;
    const r = Math.sqrt(cx*cx + cy*cy);
    const g = ctx.createRadialGradient(cx, cy, r * 0.3, cx, cy, r);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, `rgba(0,0,0,${state.vignette})`);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W(), H());
  }
  // drawVignette();

  bindSlider('sl-vig', 'vignette', 'val-vig', v => v.toFixed(2), drawVignette);

  // ─── RESIZE ───────────────────────────────────────────────────────────────
  window.addEventListener('resize', () => {
    renderer.setSize(W(), H());
    updateCamera();
    // drawVignette();
  });

  // ─── RENDER LOOP ──────────────────────────────────────────────────────────
  function animate() {
    requestAnimationFrame(animate);
    renderer.render(scene, camera);
  }
  animate();
})();
</script>
</body>
</html>
