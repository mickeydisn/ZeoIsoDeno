<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Art Studio — Modular Engine V2</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Pixel Art Studio <small style="font-size:14px;color:#888;">(Modular Engine V2)</small></h1>
    <p class="subtitle">Chaque filtre applique directement ses changements sur les pixels de l'étape précédente.</p>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <!-- Image Source -->
            <div class="section">
                <div class="section-title">📂 1. Image Source</div>
                <input type="file" id="imageLoader" accept="image/*">
            </div>

            <!-- Add Filters -->
            <div class="section">
                <div class="section-title">🧩 2. Ajouter des filtres</div>
                <div id="addToolsContainer" class="add-actions-grid"></div>
            </div>

            <!-- Pipeline -->
            <div class="section">
                <div class="section-title">🔗 3. Pipeline <small style="color:#888;">(glisser-déposer)</small></div>
                <div id="pipelineList" class="pipeline-list"></div>
            </div>

            <!-- Actions -->
            <div class="btn-group">
                <button class="action-btn" id="btnSavePipeline">📦 Save Pipeline</button>
                <button class="action-btn" id="btnLoadPipeline">📂 Load Pipeline</button>
            </div>
            <div class="btn-group" style="margin-top:4px;">
                <button class="action-btn" id="btnSaveImg">💾 Enregistrer Image</button>
            </div>
            <input type="file" id="pipelineLoader" accept=".json" style="display:none;">
        </div>

        <!-- Preview Panel -->
        <div class="preview-panel">
            <div class="zoom-controls">
                <span>🔍 <span id="zoomVal">100</span>%</span>
                <div>
                    <button class="action-btn" id="btnZoomIn" style="flex:none;padding:4px 12px;">+</button>
                    <button class="action-btn" id="btnZoomOut" style="flex:none;padding:4px 12px;">-</button>
                    <button class="action-btn btn-secondary" id="btnZoomReset" style="flex:none;padding:4px 12px;">R</button>
                </div>
            </div>
            <div class="canvas-container">
                <canvas id="mainCanvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Modules (ES Module entry point) -->
    <script type="module" src="js/modules/main.js"></script>

</body>
</html>
