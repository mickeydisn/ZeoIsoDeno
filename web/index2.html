<!DOCTYPE html>
<html>
  <head>
    <title>W3.CSS Template</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
    <link
      rel="stylesheet"
      href="https://www.w3schools.com/lib/w3-theme-blue-grey.css"
    >
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Open+Sans"
    >
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    >

    <title>HTMX Multi-Filter Table</title>
    <script src="https://unpkg.com/htmx.org@1.9.5"></script>
    <link rel="stylesheet" href="styles2.css">

    <style>
      html, body, h1, h2, h3, h4, h5 {
        font-family: "Open Sans", sans-serif;
      }
    </style>
  </head>

  <body class="w3-theme-l5">
    <!-- Navbar -->
    <div class="w3-top">
      <div class="w3-bar w3-theme-d2 w3-left-align w3-large">
        <a
          class="w3-bar-item w3-button w3-hide-medium w3-hide-large w3-right w3-padding-large w3-hover-white w3-large w3-theme-d2"
          href="javascript:void(0);"
          onclick="openNav()"
        ><i class="fa fa-bars"></i></a>
        <a
          href="#"
          class="w3-bar-item w3-button w3-padding-large w3-theme-d4"
        ><i class="fa fa-home w3-margin-right"></i>Logo</a>
        <a
          href="#"
          class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white"
          title="News"
        ><i class="fa fa-globe"></i></a>
        <a
          href="#"
          class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white"
          title="Account Settings"
        ><i class="fa fa-user"></i></a>
        <a
          href="#"
          class="w3-bar-item w3-button w3-hide-small w3-padding-large w3-hover-white"
          title="Messages"
        ><i class="fa fa-envelope"></i></a>
        <div class="w3-dropdown-hover w3-hide-small">
          <button class="w3-button w3-padding-large" title="Notifications">
            <i class="fa fa-bell"></i>
            <span class="w3-badge w3-right w3-small w3-green">3</span>
          </button>
          <div
            class="w3-dropdown-content w3-card-4 w3-bar-block"
            style="width: 300px"
          >
            <a href="#" class="w3-bar-item w3-button">One new friend request</a>
            <a href="#" class="w3-bar-item w3-button"
            >John Doe posted on your wall</a>
            <a href="#" class="w3-bar-item w3-button">Jane likes your post</a>
          </div>
        </div>
        <a
          href="#"
          class="w3-bar-item w3-button w3-hide-small w3-right w3-padding-large w3-hover-white"
          title="My Account"
        >
          <img
            src="/w3images/avatar2.png"
            class="w3-circle"
            style="height: 23px; width: 23px"
            alt="Avatar"
          >
        </a>
      </div>
    </div>

    <!-- Navbar on small screens -->
    <div
      id="navDemo"
      class="w3-bar-block w3-theme-d2 w3-hide w3-hide-large w3-hide-medium w3-large"
    >
      <a href="#" class="w3-bar-item w3-button w3-padding-large">Link 1</a>
      <a href="#" class="w3-bar-item w3-button w3-padding-large">Link 2</a>
      <a href="#" class="w3-bar-item w3-button w3-padding-large">Link 3</a>
      <a href="#" class="w3-bar-item w3-button w3-padding-large">My Profile</a>
    </div>

    <!-- Page Container -->
    <div
      class="w3-container w3-content"
      style="max-width: 1400px; margin-top: 80px"
    >
      <!-- The Grid -->
      <div class="w3-row">
        <!-- Left Column -->
        <div class="w3-col m3">
          <!-- Profile -->
          <div class="w3-card w3-round w3-white w3-margin">
            <div class="w3-container">
              <h4 class="w3-center">My Offer</h4>
              <p class="w3-center"></p>
            </div>
          </div>
          <br>
          <div id="sidebar" hx-get="/buildSidebar" hx-trigger="load"></div>
        </div>
      <!-- End Left Column -->

      <!-- Middle Column -->
      <div class="w3-col m9">
        <div id="table-content">

          <div class="w3-container w3-card w3-white w3-round w3-margin">
            <p>Select filters to see results</p>
          </div>
        </div>
      <!-- End Middle Column -->
      </div>

      <!-- End Page Container -->
    </div>
    <br>

    <!-- Footer 
    <footer class="w3-container w3-theme-d3 w3-padding-16">
      <h5>Footer</h5>
    </footer>

    <footer class="w3-container w3-theme-d5">
      <p>
        Powered by <a
          href="https://www.w3schools.com/w3css/default.asp"
          target="_blank"
        >w3.css</a>
      </p>
    </footer>
-->
    <script>
      // Accordion
      function showHideElement(id) {
        var x = document.getElementById(id);
        if (x.className.indexOf("w3-show") == -1) {
          x.className += " w3-show";
          x.previousElementSibling.className += " w3-theme-d1";
        } else {
          x.className = x.className.replace("w3-show", "");
          x.previousElementSibling.className = x.previousElementSibling
            .className.replace(" w3-theme-d1", "");
        }
      }

      // Used to toggle the menu on smaller screens when clicking on the menu button
      function openNav() {
        var x = document.getElementById("navDemo");
        if (x.className.indexOf("w3-show") == -1) {
          x.className += " w3-show";
        } else {
          x.className = x.className.replace(" w3-show", "");
        }
      }


      function activeBarItem(element) {
            element.parentElement.querySelectorAll('.bar-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
            const targetId = "content_" + element.id;
            const targetClass = targetId.substring(0, targetId.lastIndexOf("_"));

            const parent = element.parentElement.parentElement
            parent.querySelectorAll('.' + targetClass ).forEach(el => el.classList.add('w3-hide'));
            parent.querySelectorAll('#' + targetId).forEach(el => el.classList.remove('w3-hide'));

            // const targetId = this.getAttribute('hx-get').substring(1);
              // document.getElementById('content').innerHTML = document.getElementById(targetId).innerHTML;
      }


      
    function handleTagClick(element, id, tag) {
      if (element.classList.contains('w3-theme-d2')) {
          element.classList.remove("w3-theme-d2"); 
          element.classList.add("w3-white"); 

          fetch("/job/updateTag/" + id + "/remove/" + tag, {
              method: "GET"
          })
          .then(response => response.text())
          .then(data => console.log("Response:", data))
          .catch(error => console.error("Error:", error));

      } else {
        element.classList.remove("w3-white"); 
        element.classList.add("w3-theme-d2"); 
          // Call a URL (GET request)
          fetch("/job/updateTag/" + id + "/add/" + tag, {
              method: "GET"
          })
          .then(response => response.text())
          .then(data => console.log("Response:", data))
          .catch(error => console.error("Error:", error));

      }
    }

    function sideBarOptionClick(element) {
      element.classList.toggle("selected");
      const filter = element.dataset.filter;

      // Collect selected values for this filter
      const selected = [...document.querySelectorAll(`.custom-option.selected[data-filter="${filter}"]`)]
        .map(el => el.dataset.value);
      
      let values = document.getElementById(`selected-values-${filter}`).value.split(',').filter(v => v)

      // if (values.includes())

      // Update the corresponding hidden input
      document.getElementById(`selected-values-${filter}`).value = selected.join(",");

      // Trigger HTMX request
      htmx.trigger(document.getElementById(`selected-values-${filter}`), "change");

    };

    </script>
  </body>
</html>
