      // Event listeners when Click on Mini Map
      const miniMapImage = document.getElementById("miniMap-image");
      miniMapImage.addEventListener("click", (event) => {
        const sizeX = 800;
        const sizeY = 800;

        const conf = GlobalJSON;
        const scall = conf.miniMap.definition / conf.miniMap.zoom;
        console.log(
          event.offsetX - sizeX / 2,
          -event.offsetY + sizeY / 2,
        );
        const x = conf.x +
          Math.round((event.offsetX - sizeX / 2) / scall);
        const y = conf.y +
          Math.round((-event.offsetY + sizeY / 2) / scall);
        updateXY(x, y);
        updatFormEvent();
      });
