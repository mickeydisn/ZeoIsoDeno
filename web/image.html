<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Image Stream</title>
  </head>
  <body>
    <h1>Real-Time Image Stream from Deno</h1>
    <img id="video" width="500" height="500" style="border: 1px solid black">

    <script>
      const ws = new WebSocket("ws://localhost:8081");

      ws.onopen = () => {
        console.log("Connected to WebSocket server");
        ws.send("start"); // Request image stream
      };

      ws.onmessage = (event) => {
        document.getElementById("video").src = event.data;
      };

      ws.onclose = () =>
        console.log("Disconnected from WebSocket server");
      ws.onerror = (error) => console.error("WebSocket error:", error);
    </script>
  </body>
</html>
